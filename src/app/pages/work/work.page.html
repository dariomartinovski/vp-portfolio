<!-- Page header -->
<section class="work-hero">
  <div class="work-inner">
    <div class="work-hero__back">
      <button class="back-btn" (click)="goHome()">{{ '← Back' | translate }}</button>
    </div>

    <div class="work-hero__text">
      <p class="work-label">{{ 'Portfolio' | translate }}</p>
      <h1 class="work-title">{{ 'All Work' | translate }}</h1>
      <p class="work-subtitle">
        {{ 'A collection of illustrations, branding, and design projects.' | translate }}
      </p>
    </div>

    <!-- Filter tabs -->
    <div class="filters" role="tablist">
      <button
        *ngFor="let tab of filterTabs"
        class="filter-tab"
        [class.active]="activeFilter === tab.value"
        (click)="setFilter(tab.value)"
        role="tab"
        [attr.aria-selected]="activeFilter === tab.value"
      >
        {{ tab.label | translate }}
        <span class="filter-tab__count">{{ tab.count }}</span>
      </button>
    </div>
  </div>
</section>

<!-- Artwork grid -->
<section class="work-grid-section">
  <div class="work-inner">
    <!-- Empty state -->
    <div class="work-empty" *ngIf="filteredArtworks.length === 0">
      <p>{{ 'No work in this category yet.' | translate }}</p>
    </div>

    <!-- Grid -->
    <div class="work-grid" [@gridAnimation]="animationState" *ngIf="filteredArtworks.length > 0">
      <app-artwork-card
        *ngFor="let artwork of filteredArtworks; trackBy: trackByArtwork"
        [artwork]="artwork"
        (clicked)="openViewer($event)"
      >
      </app-artwork-card>
    </div>

    <!-- Result count -->
    <div class="work-count">
      <span
        >{{ filteredArtworks.length }}
        {{ (filteredArtworks.length !== 1 ? 'works' : 'work') | translate }}</span
      >
    </div>
  </div>
</section>

<!-- Footer -->
<app-footer></app-footer>

<!-- Lightbox -->
<app-image-viewer
  [artworks]="filteredArtworks"
  [currentIndex]="viewerIndex"
  [visible]="viewerVisible"
  (closed)="closeViewer()"
>
</app-image-viewer>
